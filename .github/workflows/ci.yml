name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test detection and persistence
        shell: powershell
        run: ./tests/Test-Core.ps1
      - name: Test settings and resource safety
        shell: powershell
        run: ./tests/Test-Settings.ps1
      - name: Test dialog
        shell: powershell
        run: ./tests/Test-UI.ps1
      - name: Build EXE and release archive
        shell: powershell
        run: ./Build.ps1
      - name: Test packaged executable
        shell: powershell
        run: ./tests/Test-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WslGameMode-win-x64
          path: |
            dist/WslGameMode.exe
            dist/WslGameMode-*-win-x64.zip
            dist/SHA256SUMS.txt
