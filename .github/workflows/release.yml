name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag
        shell: powershell
        run: |
          if ($env:GITHUB_REF_NAME -ne 'v0.1.0') { throw 'Update the application version and release notes before tagging.' }
      - name: Test detection and persistence
        shell: powershell
        run: ./tests/Test-Core.ps1
      - name: Test dialog
        shell: powershell
        run: ./tests/Test-UI.ps1
      - name: Build
        shell: powershell
        run: ./Build.ps1
      - name: Test EXE
        shell: powershell
        run: ./tests/Test-Release.ps1
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME ./dist/WslGameMode.exe ./dist/WslGameMode-v0.1.0-win-x64.zip ./dist/SHA256SUMS.txt --verify-tag --title "WSL Game Mode $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
